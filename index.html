<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="DRIFTHOLD - a cozy pixel-art space game: build your drifting ship, mine asteroids with a tiny drone.">
<title>DRIFTHOLD</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: none; }
  #wrap { position: fixed; inset: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #game { display: block; outline: none; touch-action: none;
    image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" width="320" height="180"></canvas></div>
<!-- classic scripts (no ES modules) so the game runs straight from file:// -->
<script src="js/palette.js"></script>
<script src="js/util.js"></script>
<script src="js/font.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/sim.js"></script>
<script src="js/ui.js"></script>
<script src="js/crew.js"></script>
<script src="js/progression.js"></script>
<script src="js/scenes/title.js"></script>
<script src="js/scenes/ship.js"></script>
<script src="js/scenes/run.js"></script>
<script src="js/scenes/map.js"></script>
<script src="js/panels.js"></script>
<script src="js/main.js"></script>
</body>
</html>
